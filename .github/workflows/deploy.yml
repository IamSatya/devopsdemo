name: AWS Provision & Deploy CI/CD Pipeline (Access Keys & Git State)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Provision AWS Infrastructure & Generate SSH Key Pair (Terraform)
  # --------------------------------------------------------------------------
  provision-aws-infrastructure:
    name: ☁️ Provision AWS Infrastructure (Terraform)
    runs-on: ubuntu-latest
    outputs:
      ec2_public_ip: ${{ steps.tf_outputs.outputs.ec2_ip }}
      ssh_key: ${{ steps.tf_outputs.outputs.ssh_key }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS Credentials (IAM Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Apply (Provision EC2 & Dynamic SSH Key)
        run: |
          cd terraform
          terraform apply -auto-approve

      - name: Extract Terraform Outputs & Dynamic SSH Key
        id: tf_outputs
        run: |
          cd terraform
          EC2_IP=$(terraform output -raw public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          
          # Extract dynamically generated private SSH key safely
          SSH_KEY=$(terraform output -raw ssh_private_key_pem)
          echo "ssh_key<<EOF" >> $GITHUB_OUTPUT
          echo "$SSH_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Provisioned EC2 Public IP: $EC2_IP"

      - name: Commit Updated Terraform State Back to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(terraform): update state and deployment keys [skip ci]"
          file_pattern: "terraform/terraform.tfstate*"

  # --------------------------------------------------------------------------
  # Job 2: Deploy Web Application Code to Provisioned EC2 Instance
  # --------------------------------------------------------------------------
  deploy-website:
    name: 🚀 Deploy Website to AWS EC2
    needs: provision-aws-infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Wait for EC2 Nginx Initialization
        run: |
          echo "Waiting 25 seconds for EC2 instance Nginx web server to complete initialization..."
          sleep 25

      - name: Sync Website Files to AWS EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.provision-aws-infrastructure.outputs.ec2_public_ip }}
          username: 'ubuntu'
          key: ${{ needs.provision-aws-infrastructure.outputs.ssh_key }}
          port: 22
          source: "website/*"
          target: "/var/www/html"
          strip_components: 1
          overwrite: true

      - name: Reload Nginx Web Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.provision-aws-infrastructure.outputs.ec2_public_ip }}
          username: 'ubuntu'
          key: ${{ needs.provision-aws-infrastructure.outputs.ssh_key }}
          port: 22
          script: |
            sudo chown -R ubuntu:www-data /var/www/html
            sudo chmod -R 775 /var/www/html
            sudo systemctl reload nginx
            echo "🏥 PulseCare Health Website successfully deployed to AWS EC2!"

      - name: Deployment Summary Report
        run: |
          EC2_IP="${{ needs.provision-aws-infrastructure.outputs.ec2_public_ip }}"
          echo "### 🚀 Automated AWS Provisioning & Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "**Website URL**: http://$EC2_IP" >> $GITHUB_STEP_SUMMARY
          echo "**EC2 Public IP**: \`$EC2_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "**Authentication**: AWS IAM Access Keys 🔑" >> $GITHUB_STEP_SUMMARY
